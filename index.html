<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>7.3 A New Life · 7.4 Chaos! · 7.5 Time to Speak</title>
<style>
:root{--y:#B8860B;--yl:#FBF3DC;--t:#2b2b2b;--bg:#fff;--g:#8a8a8a}
@media(prefers-color-scheme:dark){:root{--bg:#fff;--t:#2b2b2b}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#fff;color:var(--t);font-family:Georgia,'Segoe UI',sans-serif}
#deck{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0)}
.slide{display:none;position:absolute;inset:0 0 58px 0;padding:3vh 6vw;overflow:auto;flex-direction:column;justify-content:flex-start}
.slide.on{display:flex}
.tag{color:var(--y);font:700 clamp(13px,1.6vw,20px) sans-serif;letter-spacing:.1em;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,64px);margin:.2em 0;color:var(--y)}h2{font-size:clamp(24px,3.4vw,44px);margin:.2em 0 .3em;border-bottom:4px solid var(--y);padding-bottom:.15em}
p,li,td{font-size:clamp(17px,2.2vw,28px);line-height:1.45}.ins{font:600 clamp(16px,2vw,25px) sans-serif;color:var(--y)}
button{align-self:flex-start;font:700 clamp(14px,1.7vw,20px) sans-serif;background:var(--y);color:#fff;border:0;border-radius:10px;padding:.55em 1.1em;margin:.3em .3em .3em 0;cursor:pointer}
button.o{background:#fff;color:var(--y);border:2px solid var(--y)}button:disabled{opacity:.4}
input[type=text]{font-size:clamp(18px,2.4vw,30px);padding:.4em .6em;border:3px solid var(--y);border-radius:10px;width:min(480px,90%)}
select{font:clamp(18px,2.4vw,30px) sans-serif;border:2px solid var(--y);border-radius:8px;padding:.2em;background:#fff;color:var(--t)}
select.ok{background:var(--yl);border-color:var(--y)}select.no{border-style:dashed;border-color:var(--g);color:var(--g)}
.mk{font-weight:700;color:var(--y);margin-left:4px}
table{border-collapse:collapse;width:100%}th,td{border:2px solid var(--y);padding:.4em .7em;text-align:left;vertical-align:top}th{background:var(--yl);color:var(--y)}
.chat{display:flex;flex-direction:column;gap:.5em;max-width:900px}
.b{max-width:78%;padding:.55em 1em;border-radius:22px;font-size:clamp(16px,2.1vw,26px);line-height:1.35}
.b small{display:block;font:700 .6em sans-serif;color:var(--y);text-transform:uppercase}
.b.L{align-self:flex-start;background:var(--yl);border:2px solid var(--y);border-bottom-left-radius:4px}
.b.R{align-self:flex-end;background:#fff;border:2px solid var(--y);border-bottom-right-radius:4px}
.hid{display:none}
.card{background:var(--yl);border-left:8px solid var(--y);padding:.6em 1em;border-radius:10px;margin:.5em 0}
.rev{display:none;font-size:clamp(24px,3.2vw,42px);line-height:1.4}.rev.show{display:block}
mark{background:transparent;color:inherit}.hl mark{background:#F3D878;border-bottom:3px solid var(--y);font-weight:700}
.big{font-size:clamp(34px,6vw,80px);color:var(--y);font-weight:700;margin:.1em 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:2vw}@media(max-width:700px){.row2{grid-template-columns:1fr}}
#bar{position:fixed;left:0;right:0;bottom:0;height:58px;display:flex;align-items:center;gap:8px;padding:0 3vw env(safe-area-inset-bottom,0);background:#fff;border-top:3px solid var(--y);z-index:5}
#prog{flex:1;height:8px;background:var(--yl);border-radius:4px}#pf{height:100%;background:var(--y);border-radius:4px;width:0}
#notes{position:fixed;left:0;right:0;bottom:58px;max-height:55vh;overflow:auto;background:#fff;border-top:5px solid var(--y);padding:1em 5vw;display:none;z-index:6;font:16px/1.5 sans-serif}
#notes.on{display:block}#notes b{color:var(--y)}
.cert{border:12px double var(--y);padding:4vh 4vw;text-align:center;background:#fff}
@media print{#bar,#notes,.np{display:none}.slide{position:static;display:none}.slide.on{display:block}}
</style></head><body>
<div id="deck"></div>
<div id="bar"><button class="o" onclick="go(-1)">◀</button><div id="prog"><div id="pf"></div></div><span id="cnt" style="font:600 15px sans-serif"></span><button onclick="go(1)">▶</button></div>
<script>
const S=[];const add=(tag,body,notes)=>S.push({tag,body,notes});
const sel=(v,set,bank)=>`<select data-v="${v}" data-set="${set.join('|')}"><option value="">–</option>${bank.map(o=>`<option>${o}</option>`).join('')}</select><span class="mk"></span>`;
const btns=`<div class="np"><button data-a="check">Check</button><button class="o" data-a="show">Show answers</button><button class="o" data-a="hide">Hide answers</button><button class="o" data-a="retry">Try it again</button></div>`;
const rev=(id,label,html)=>`<button class="o" data-a="rev" data-t="${id}">${label}</button><div class="rev card" id="${id}">${html}</div>`;
const chat=(lines,first='L')=>`<div class="chat" data-chat>${lines.map((l,i)=>`<div class="b ${l[0]=='A'?'L':'R'} ${i?'hid':''}"><small>${l[1]}</small>${l[2]}</div>`).join('')}</div><div class="np"><button data-a="next">Next ▶</button><button class="o" data-a="all">Show all</button><button class="o" data-a="reset">Try it again</button></div>`;
const NW=`<b>No audio is included in the pages;</b> read the script yourself or use the course audio.`;

// 1 title
add('Welcome',`<h1>Your life these days</h1><p class="ins">7.3 A New Life · 7.4 Chaos! · 7.5 Time to Speak</p><p>What is your name?</p><input id="nm" type="text" placeholder="Type your name here" oninput="localStorage&&0"><p class="np"><button onclick="if(!nm.value.trim()){nm.focus();return}go(1)">Start ▶</button></p>`,
`<b>Aim:</b> welcome learners and collect the name for the certificate. <b>Time:</b> 2 min.<br><b>Steps:</b> 1) Greet the group. 2) Learners type their name. 3) Tell them a certificate appears at the end after they have viewed every slide. <b>ICQ:</b> "What do you type?" (my name). "When do you get the certificate?" (at the end). <b>Teacher guide:</b> not supplied with the images, so add your own guide notes here.`);
// 2 objectives
add('Lesson objectives',`<h2>Today we will…</h2><div class="card"><b>7.3</b> share news on the phone</div><div class="card"><b>7.4</b> write a blog about things happening now (we read a blog as a model)</div><div class="card"><b>7.5</b> ask what people are doing these days</div>`,
`<b>Aim:</b> share the lesson objectives from the student pages. <b>Time:</b> 2 min. Read each objective aloud. <b>CCQ:</b> "Is a phone call long or short?" (can be either) – "Do we write today?" (no, we only read the blog model). <b>Problem:</b> "news" is uncountable; do not say "a news". Add teacher guide notes here.`);
// 3 7.3 1A
add('7.3 · Functional language · A',`<h2>A New Life</h2><p class="ins">Look at the people. Are they having a long or a short conversation? How long are your phone calls?</p>${rev('a1','Show ideas',`Long: the woman on the sofa is smiling and relaxed, with a cup in her hand. Short: the woman in the red circle holds an old red phone. Your answers about your own calls will differ: "My calls are short/long."`)}`,
`<b>Aim:</b> lead-in and prediction; personalise the topic. <b>Time:</b> 4 min.<br><b>Steps:</b> 1) Show the pictures from the student book (not embedded). 2) Pairs answer. 3) Class feedback. 4) Reveal suggestions. <b>CCQ:</b> "Is 3 minutes long or short?" <b>ICQ:</b> "Do you talk about the picture or your life?" (both). <b>Problem:</b> learners may say "I talk by phone long"; recast: "My calls are long." Add guide notes here.`);
// 4 1B dialogue
add('7.3 · Functional language · B',`<h2>Luana is calling her friend Jennifer</h2><p class="ins">Read and listen (audio 2.05). What's new in Luana's life?</p>${chat([['A','Jennifer','Hello.'],['B','Luana','Hi, Jennifer. It\'s Luana.'],['A','Jennifer','Hey, Luana!'],['B','Luana','How\'s it going?'],['A','Jennifer','Not bad, thanks. How are you doing?'],['B','Luana','Good, thanks. Well, I\'m busy.'],['A','Jennifer','Really? What are you doing these days?'],['B','Luana','I have a new job, in Monterrey.'],['A','Jennifer','Oh, wow! Monterrey? So you\'re not living in Mexico City now.'],['B','Luana','That\'s right. I\'m living in Monterrey. I live in a new building. It\'s expensive, but it\'s very nice. And I have a new boyfriend.'],['A','Jennifer','Really? Great! You have a new life! I want to hear all about it!']])}${rev('a2','Show answers','A new job in Monterrey · a new building (expensive but very nice) · a new boyfriend')}`,
`<b>Aim:</b> gist listening/reading; text-based presentation of the target language. <b>Time:</b> 8 min.<br><b>Steps:</b> 1) Set the question first. 2) Play audio 2.05 while learners follow the bubbles (press Next to reveal). 3) Pairs compare. 4) Reveal answers. <b>ICQ:</b> "Do you read and listen?" "What is the question?" <b>CCQ:</b> "Who is calling?" (Luana) "Where is she living now?" (Monterrey). <b>Problems:</b> "I live" and "I'm living" – defer to slide 5. Add guide notes here.`);
// vocab
const voc=(w,ph,mean,form,ex,notes)=>add('New vocabulary',`<p class="tag">Meaning · Pronunciation · Form</p><div class="big">${w}</div><div class="row2"><div class="card"><b>Meaning:</b> ${mean}</div><div class="card"><b>Pronunciation:</b> ${ph}</div></div><div class="card"><b>Form:</b> ${form}</div><p><i>${ex}</i></p>`,notes);
const vn=(c)=>`<b>Aim:</b> teach one item (MPF). <b>Time:</b> 3 min. <b>Steps:</b> elicit from context, concept check, model 2x, choral drill, individual drill, mark stress. ${c} Add guide notes here.`;
// 1C chart
const bank=['Hi','Hey','It\'s','going','are','doing','bad','Good'];
add('7.3 · Functional language · C',`<h2>Complete the chart</h2><p class="ins">Use the expressions in bold from the conversation.</p><table><tr><th>Answering the phone and greeting people</th><th>Asking people how they are</th><th>Responding</th></tr><tr><td>1 Hello.<br>2 ${sel('Hi',['Hi'],bank)}, Jennifer.<br>3 ${sel('It\'s',['It\'s'],bank)} Luana.<br>4 ${sel('Hey',['Hey'],bank)}, Luana!</td><td>How's it 5 ${sel('going',['going'],bank)}?<br>(How's = How is)<br>How 6 ${sel('are',['are'],bank)} you 7 ${sel('doing',['doing'],bank)}?<br>How are you?</td><td>Not 8 ${sel('bad',['bad'],bank)}, thanks.<br>9 ${sel('Good',['Good'],bank)}, thanks.<br>I'm fine.</td></tr></table><p class="ex-wrap">${btns}</p>`,
`<b>Aim:</b> controlled practice of the phone phrases. <b>Time:</b> 6 min. <b>Steps:</b> 1) Learners choose answers alone. 2) Compare in pairs. 3) Check. <b>Answers:</b> 2 Hi, 3 It's, 4 Hey, 5 going, 6 are, 7 doing, 8 bad, 9 Good. <b>ICQ:</b> "Do you pick a word from the list?" <b>Problem:</b> Hi/Hey interchangeable; accept either where sensible, the book answers are given. Add guide notes here.`);
// 1D order
const ord=['Good, thanks. How\'s it going?','Hey, Andrew! How are you doing?','Hello.','Not bad.','Hi, Francisco. It\'s Andrew.'];const oa=[4,3,1,5,2];
add('7.3 · Functional language · D',`<h2>Put the phone conversation in the correct order</h2><p class="ins">Pair work · listen (audio 2.06) and check. Then practise with a partner.</p>${ord.map((l,i)=>`<p>${sel(oa[i],[oa[i]],[1,2,3,4,5])} ${l}</p>`).join('')}${btns}${rev('d1','Show the conversation',`<div class="chat">${[1,2,3,4,5].map(n=>`<div class="b ${n%2?'L':'R'}">${ord[oa.indexOf(n)]}</div>`).join('')}</div>`)}`,
`<b>Aim:</b> sequence a phone call; consolidate. <b>Time:</b> 8 min. <b>Steps:</b> 1) Learners number lines. 2) Pairs compare. 3) Play 2.06 and check. 4) Practise reading in pairs, then swap roles. <b>Answers:</b> 1 Hello. 2 Hi, Francisco. It's Andrew. 3 Hey, Andrew! How are you doing? 4 Good, thanks. How's it going? 5 Not bad. <b>ICQ:</b> "Who speaks first?" (Francisco answers). Add guide notes here.`);
// 4 Speaking
add('7.3 · 4 Speaking',`<h2>Pair work</h2><p class="ins">Imagine you're calling your partner. Start the call, and then talk about some news. Use some of the questions below. React to the things your partner says. Then change roles.</p><div class="card">How are you doing? · Are you busy? · What are you doing right now? · What about you?</div>${chat([['A','Clara',"Hey, Ali. It's Clara."],['B','Ali',"Hey, Clara! How are you doing?"],['A','Clara',"Good, thanks. Are you busy?"],['B','Ali',"Not really. What about you?"],['A','Clara',"I'm busy, but I have some news! I have a new job."],['B','Ali',"Really? Great! What are you doing these days?"],['A','Clara',"I'm working in a new office downtown. It's very nice."],['B','Ali',"Wow! Are you living in the same apartment?"],['A','Clara',"No, I'm living in a new building. It's expensive, but it's very nice."],['B','Ali',"That's right, you have a new life! What are you doing right now?"],['A','Clara',"I'm sitting on the sofa with a cup of tea. And you?"],['B','Ali',"I'm cooking dinner. I want to hear all about it!"],['A','Clara',"OK! First, the job is in Monterrey…"],['B','Ali',"Oh, wow! Tell me more!"]])}`,
`<b>Aim:</b> freer speaking practice. <b>Time:</b> 8 min. <b>Steps:</b> 1) Show the model (bubbles). 2) Demonstrate with a strong learner. 3) Pairs call each other, then swap. 4) Monitor and note errors for delayed feedback. <b>ICQ:</b> "Do you call or write?" (call). "Do you change roles?" (yes). <b>Problem:</b> learners answer only "fine"; encourage "What about you?" and reactions ("Really? Great!"). Add guide notes here.`);
// 7.4 1A
const blog=`<div class="card"><p><b>Jamie's Blog</b> · Home · About · Blog</p><p><b>Bloggers sometimes write from difficult places: mountains, deserts, rainforests … So today, my blog is from a difficult place, too. I'm writing from my living room.</b></p><p>Why is it difficult to write in here? Well, my brother's playing soccer (yes, in the living room.) The ball is going <i>BOOM-BOOM-BOOM</i> on the wall near my table and chair. My sister's doing her homework. Every two minutes, she asks me a question: "What's 15% of 500? What's 50% of 320?" So, really, <i>I'm</i> doing her homework.</p><p>The TV is on, but I don't know why. My mom's talking about work on the phone, so she isn't watching TV. And my dad isn't watching it. He's in the kitchen: <i>PSSSSSS, CRASH, BANG!</i> He's cooking – I think. And the cat doesn't like TV. But she likes laptops. She's walking on my laptop … and now she's going to sleep! How do I work in this place? It's chaos!</p></div>`;
add('7.4 · Chaos! · Reading A',`<h2>Skim the text</h2><p class="ins">Where is the man? What is on his laptop?</p>${blog}${rev('b1','Show answers','He is in his living room. His blog is on his laptop.')}`,
`<b>Aim:</b> skimming for gist. <b>Time:</b> 5 min. <b>Steps:</b> 1) Set a 30-second limit. 2) Learners skim. 3) Check. <b>ICQ:</b> "Do you read every word?" (no) "How long?" (30 sec). <b>Note:</b> the text is a teenage blogger, Jamie, although the book prompt says "man". <b>Problem:</b> learners read word by word; use a timer. Add guide notes here.`);
const W=['chaos','blog','rainforest','crash','bang'];
const defs=[['a thick forest in a hot place where it rains a lot','rainforest'],['a sudden loud noise, like a door closing','bang'],['a website where a person writes regularly about life or ideas','blog'],['a situation with a lot of noise and activity where nothing is calm or organised','chaos'],['the loud noise of something falling or breaking','crash']];
add('7.4 · New vocabulary',`<h2>Match the words to the meanings</h2><p class="ins">Words from Jamie's blog: <b>chaos · blog · rainforest · crash · bang</b></p><table>${defs.map(d=>`<tr><td>${d[0]}</td><td style="white-space:nowrap">${sel(d[1],[d[1]],W)}</td></tr>`).join('')}</table>${btns}`,
`<b>Aim:</b> teach five new words from the blog (meaning, pronunciation, form) through matching. <b>Time:</b> 8 min.<br><b>Steps:</b> 1) Point to each word in the blog (rainforests in line 1, BANG and CRASH in the kitchen, chaos in the last line). 2) Learners match alone, then compare in pairs. 3) Check. 4) Drill each word: model twice, choral, individual, mark stress. <b>Answers:</b> rainforest, bang, blog, chaos, crash.<br><b>Pronunciation:</b> chaos /ˈkeɪ.ɒs/ (stress CHA, "ch" = /k/); blog /blɒɡ/; rainforest /ˈreɪn.fɒr.ɪst/ (stress RAIN); crash /kræʃ/; bang /bæŋ/ (ends /ŋ/, no clear g). <b>Form:</b> chaos uncountable noun (It's chaos!); blog, rainforest, crash, bang countable nouns; blogger = a person who writes a blog. <b>CCQ:</b> "Is a quiet library chaos?" (no) "Is a rainforest hot or cold?" (hot) "Is a bang loud or quiet?" (loud) "Is it online?" – blog (yes). <b>ICQ:</b> "Do you choose a word for each meaning?" <b>Problems:</b> /tʃ/ in "chaos"; confusing crash and bang (crash = falling/breaking, bang = sudden hit/closing). Add guide notes here.`);
// 7.4 1B
const B=['me','brother','sister','mom','dad','laptop','TV','phone','table','chair','living room','kitchen','cat'];
const row=(n,l,set,pre)=>`<tr><td>${n} ${l}</td><td>${pre||''}${set.map((s,i)=>sel(s,set,B)).join(' ')}</td></tr>`;
add('7.4 · Chaos! · Reading B',`<h2>Read for details</h2><p class="ins">Read the blog again. Choose words to complete the chart.</p><table>${row(5,'people in the family',['brother','sister','mom','dad'],'<b>me</b> ')}${row(3,'technology words',['laptop','TV','phone'])}${row(2,'pieces of furniture',['table','chair'])}${row(2,'rooms',['living room','kitchen'])}${row(1,'animal',['cat'])}</table>${btns}`,
`<b>Aim:</b> reading for specific information. <b>Time:</b> 6 min. <b>Steps:</b> 1) Point out "me" is the example. 2) Learners choose. 3) Pairs compare. 4) Check. <b>Answers:</b> people: me, brother, sister, mom, dad; technology: laptop, TV, phone; furniture: table, chair; rooms: living room, kitchen; animal: cat (words can be in any order within a row). <b>ICQ:</b> "How many people?" (5). Add guide notes here.`);
add('7.4 · Chaos! · Reading C',`<h2>Think critically</h2><p class="ins">Pair work. Which people from exercise 1B are busy? Which are having fun?</p>${rev('c1','Show ideas','Busy: Jamie (writing), his sister (homework), his mom (talking about work), his dad (cooking). Having fun: his brother (playing soccer), the cat (walking on the laptop).')}`,
`<b>Aim:</b> discussion and personalised response to the text. <b>Time:</b> 5 min. <b>Steps:</b> pairs decide, justify with "She's…/He's…", class feedback, reveal ideas. <b>CCQ:</b> "Is cooking busy or fun?" (opinion – accept reasons). <b>Problem:</b> mixing "is" and "are" with names. Add guide notes here.`);
// 7.5 A
add('7.5 · Time to Speak · A Prepare',`<h2>Your life these days</h2><p class="ins">Read the note and questions below. Which topic is interesting for you? Which topic is boring?</p><div class="card"><b>You are with a group of people. They are your friends, but you hardly ever see them. What do you say? Here are some ideas!</b></div><table><tr><th>Topics</th><th>Main question</th><th>Follow-up questions</th></tr><tr class="rr"><td><b>Work and school</b></td><td>Are you going to college?</td><td>Are your classes easy or difficult? Are you doing a lot of homework these days?</td></tr><tr class="rr hid"><td><b></b></td><td>What classes are you taking?</td><td>Do you like your classes? Why or why not?</td></tr><tr class="rr hid"><td><b></b></td><td>Where are you working these days?</td><td>Are you working every day? Is your job interesting? Is it difficult?</td></tr><tr class="rr hid"><td><b>Free time</b></td><td>What are you reading these days?</td><td>Is it good? Who's the writer?</td></tr><tr class="rr hid"><td><b></b></td><td>What are you watching on TV?</td><td>Is it interesting? Is it funny? Who's in it?</td></tr><tr class="rr hid"><td><b></b></td><td>What music are you listening to?</td><td>Who's your favorite singer? What's your favorite band?</td></tr><tr class="rr hid"><td><b></b></td><td>Do you play video games?</td><td>Which games are you playing right now?</td></tr><tr class="rr hid"><td><b></b></td><td>Are you going out a lot these days?</td><td>Where do you go? What's your favorite place?</td></tr><tr class="rr hid"><td><b></b></td><td>Are you playing sports?</td><td>What sports do you play? Where?</td></tr><tr class="rr hid"><td><b>Home life</b></td><td>How is your family?</td><td>Are you living with them now?</td></tr><tr class="rr hid"><td><b></b></td><td>Are you living in a new place?</td><td>Is it an apartment or house? Do you like it? Is it close to work/school?</td></tr><tr class="rr hid"><td><b></b></td><td>Are you cooking a lot these days?</td><td>Do you cook for other people?</td></tr></table><div class="np"><button data-a="rnext">Next question ▶</button><button class="o" data-a="rall">Show all</button><button class="o" data-a="rreset">Try it again</button></div>`,
`<b>Aim:</b> prepare ideas for the role play. <b>Time:</b> 6 min. <b>Steps:</b> 1) Read the note. 2) Press Next question to reveal one question and its follow-ups at a time; read and drill each. 3) Learners choose one interesting and one boring topic and tell a partner using the Useful Phrases on the next slide. <b>Useful phrases (PREPARE):</b> I like / don't like … I think … is interesting/boring. And you? <b>CCQ:</b> "Do you see these friends often?" (no). <b>Problem:</b> "How is your family?" (not "How are"). Add guide notes here.`);
add('7.5 · Time to Speak · B Role play',`<h2>Role play</h2><p class="ins">Imagine you are at a party. Talk to different people about different topics. Ask and answer some of the questions from the chart.</p><div class="np"><button class="" data-a="tab" data-t="rp0">Work and school</button><button class="o" data-a="tab" data-t="rp1">Free time</button><button class="o" data-a="tab" data-t="rp2">Home life</button></div><div class="rp" id="rp0">${chat([['A','Ana',"Hi, Sam. How's it going?"],['B','Sam',"Good, thanks! What are you doing these days?"],['A','Ana',"I'm going to college. I'm taking three classes."],['B','Sam',"What classes are you taking?"],['A','Ana',"English, math and history."],['B','Sam',"Do you like your classes? Why or why not?"],['A','Ana',"I like English. It's very interesting! And you? Where are you working these days?"],['B','Sam',"I'm working in a café. It's busy, but it isn't difficult."],['A','Ana',"Are you working every day?"],['B','Sam',"Not every day. Not bad!"]])}</div><div class="rp hid" id="rp1">${chat([['A','Ana',"Hey, Sam! What are you reading these days?"],['B','Sam',"A new novel. It's very good!"],['A','Ana',"Is it funny? Who's in it?"],['B','Sam',"Yes, it's funny! It's about two friends. What music are you listening to?"],['A','Ana',"I'm listening to a lot of pop. Who's your favorite singer?"],['B','Sam',"I like rock bands. Are you playing sports?"],['A','Ana',"Yes! I play soccer."],['B','Sam',"Where do you play?"],['A','Ana',"In the park near my apartment."]])}</div><div class="rp hid" id="rp2">${chat([['A','Ana',"Hi, Sam. How is your family?"],['B','Sam',"They're fine, thanks. Are you living in a new place?"],['A','Ana',"Yes! I'm living in a new apartment."],['B','Sam',"Is it an apartment or house? Do you like it?"],['A','Ana',"It's an apartment. I love it! It's close to school."],['B','Sam',"Are you living with your family now?"],['A','Ana',"No, I'm living with a friend. We're cooking a lot these days!"],['B','Sam',"Do you cook for other people?"],['A','Ana',"Yes, we cook for our friends. Come to dinner!"]])}</div><div class="card">ROLE PLAY phrases: Hi, [name]. How's it going? · Hey, [name]! What are you doing these days?</div>`,
`<b>Aim:</b> fluency role play. <b>Time:</b> 10 min. <b>Steps:</b> 1) Choose a topic button (Work and school, Free time, Home life) and show its model with Next. 2) Demonstrate with a learner. Repeat for each topic. 3) Learners stand, mingle, change partners every 2 minutes. 4) Monitor; note errors for feedback. <b>ICQ:</b> "Where are you?" (at a party) "Do you stay with one partner?" (no). <b>Note:</b> the model reuses chart questions. Add guide notes here.`);
add('7.5 · Time to Speak · C Agree',`<h2>Agree</h2><p class="ins">Talk about popular things from your conversations. What are a lot of people doing these days?</p>${chat([['A','Student A','Work and school is a popular topic.'],['B','Student B','Yes! A lot of people are working at home.'],['A','Student A','A lot of people are watching a new series.']])}<div class="card">AGREE phrases: (Work and school / free time / home life) is a popular topic. · A lot of people are doing …</div>`,
`<b>Aim:</b> report back and find common ideas. <b>Time:</b> 6 min. <b>Steps:</b> pairs share what they heard, class finds the most popular activity. <b>CCQ:</b> "Is it one person or many?" (many). <b>Problem:</b> "A lot of people is" – should be "are". Delayed error correction here. Add guide notes here.`);
add('Certificate',`<div id="cw"></div>`,`<b>Aim:</b> close the lesson and celebrate. Give feedback on learner language, then let learners print or save the certificate. Add guide notes here.`);

// engine
const deck=document.getElementById('deck');let cur=0;const seen=new Set();
S.forEach((s,i)=>{const d=document.createElement('section');d.className='slide';d.innerHTML=`<p class="tag">${s.tag}</p>${s.body}`;deck.appendChild(d)});
const sl=[...document.querySelectorAll('.slide')];
function go(n){show(Math.max(0,Math.min(S.length-1,cur+n)))}
function show(i){cur=i;seen.add(i);sl.forEach((e,j)=>e.classList.toggle('on',j==i));document.getElementById('cnt').textContent=(i+1)+'/'+S.length;document.getElementById('pf').style.width=((i+1)/S.length*100)+'%';
 if(i==S.length-1){const name=(document.getElementById('nm').value||'Student').trim();const done=seen.size>=S.length;document.getElementById('cw').innerHTML=done?`<div class="cert"><p class="tag">Certificate of completion</p><h1>${name.replace(/</g,'')}</h1><p>has completed the lesson</p><h2 style="border:0">7.3 A New Life · 7.4 Chaos! · 7.5 Time to Speak</h2><p>${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</p><p class="np"><button onclick="print()">Print</button></p></div>`:`<h2>Almost there!</h2><p>View every slide to receive your certificate. ${S.length-seen.size} slides left.</p>`}}
function rows(el){return [...el.querySelectorAll('select')]}
function mark(s,ok){s.className=ok?'ok':'no';s.nextElementSibling.textContent=ok?'✓':'✗'}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a,sc=b.closest('.slide');
 if(a=='check')rows(sc).forEach(s=>{if(s.value)mark(s,s.dataset.set.split('|').includes(s.value));else{s.className='';s.nextElementSibling.textContent=''}});
 if(a=='show'){const used={};rows(sc).forEach(s=>{const set=s.dataset.set;used[set]=(used[set]||0);s.value=s.dataset.v;mark(s,true)})}
 if(a=='hide'||a=='retry')rows(sc).forEach(s=>{s.value='';s.className='';s.nextElementSibling.textContent=''});
 if(a=='rev')document.getElementById(b.dataset.t).classList.toggle('show');
 if(a=='hl')document.getElementById(b.dataset.t).classList.toggle('hl');
 const np=b.closest('.np'),ch=np&&np.previousElementSibling;const bs=[...((ch&&ch.hasAttribute('data-chat')?ch:sc).querySelectorAll('.b'))];
 if(a=='tab'){sc.querySelectorAll('.rp').forEach(p=>p.classList.toggle('hid',p.id!=b.dataset.t));b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('o',x!=b))}
 const rr=[...sc.querySelectorAll('tr.rr')];
 if(a=='rnext'){const h=rr.find(x=>x.classList.contains('hid'));if(h){h.classList.remove('hid');h.scrollIntoView({block:'nearest',behavior:'smooth'})}}
 if(a=='rall')rr.forEach(x=>x.classList.remove('hid'));
 if(a=='rreset')rr.forEach((x,i)=>x.classList.toggle('hid',i>0));
 if(a=='next'){const h=bs.find(x=>x.classList.contains('hid'));if(h)h.classList.remove('hid')}
 if(a=='all')bs.forEach(x=>x.classList.remove('hid'));
 if(a=='reset')bs.forEach((x,i)=>x.classList.toggle('hid',i>0));
});
document.addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowRight')go(1);if(e.key=='ArrowLeft')go(-1)});
show(0);
</script></body></html>
